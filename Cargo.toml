[workspace]
resolver = "3"
members = ["crates/core", "crates/audio", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/vitormakino/polyrhythmic-metronome-rs"

[workspace.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit"] }
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
cpal = "0.18.2"
rtrb = "0.4.1"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
assert_no_alloc = "1.1.2"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
dirs = "7.0.0"
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
