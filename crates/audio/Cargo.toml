[package]
name = "polyrhythmic-metronome-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Real-time CoreAudio/cpal engine for the polyrhythmic metronome."

[lib]
name = "pm_audio"

[lints.rust]
unsafe_code = "allow" # CoreAudio property queries

[lints.clippy]
all = "warn"

[dependencies]
polyrhythmic-metronome-core = { path = "../core" }
rtrb.workspace = true
cpal.workspace = true
objc2-core-audio.workspace = true
objc2-core-foundation.workspace = true
# Debug builds check the data callback with it (release: a no-op).
assert_no_alloc.workspace = true
