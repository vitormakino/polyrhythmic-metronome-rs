#:schema ./schema/config.schema.json
# Polyrhythmic Metronome configuration. The app reads this file and applies
# changes as soon as you save; it never writes to it again.

# Interface language: "en" (default), "pt-BR", or the code of a file you put in
# locales/ (for example locales/de.toml, starting with
# #:schema ../schema/locale.schema.json).
language = "en"

# Color theme: "default", "light", or the name of a file you put in themes/
# (for example themes/nord.toml, starting with
# #:schema ../schema/theme.schema.json). Any Omarchy colors.toml works as a
# theme file.
theme = "default"
